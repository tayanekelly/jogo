<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100dvh;
  background: linear-gradient(135deg, #ffc0cb, #ff69b4);
  font-family: Arial, sans-serif;
  text-align: center;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}
.container {
  padding: 20px;
  width: 100%;
}
h1 { color: #fff; font-size: 30px; }
p { color: #fff; font-size: 20px; }
button {
  padding: 16px 30px;
  border: none;
  border-radius: 30px;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
  touch-action: manipulation;
}
#sim {
  background: #ff1493;
  color: white;
}
#nao {
  background: white;
  color: #ff1493;
  position: fixed;
  left: 60%;
  top: 65%;
  transition: left .15s, top .15s;
}
</style>

<div class="container" id="pedido">
  <h1>💗 Tenho uma pergunta... 💗</h1>
  <p>Quer se casar comigo? 🥹❤️</p>
  <button id="sim" onclick="aceitou()">
    SIM ❤️
  </button>
  <button id="nao">NÃO 😢</button>
</div>

<script>
const nao = document.getElementById("nao");

function fugir() {
  const x = Math.random() *
    (window.innerWidth - nao.offsetWidth - 20);
  const y = Math.random() *
    (window.innerHeight - nao.offsetHeight - 20);
  nao.style.left = Math.max(10, x) + "px";
  nao.style.top = Math.max(10, y) + "px";
}

nao.addEventListener("pointerdown", e => {
  e.preventDefault();
  fugir();
});
nao.addEventListener("pointerenter", fugir);
nao.addEventListener("click", fugir);

function aceitou() {
  nao.style.display = "none";
  document.getElementById("pedido").innerHTML = `
    <h1>AAAAAA! 😭❤️</h1>
    <h1>AGORA ESTAMOS NOIVOS!</h1>
    <p>Você acaba de me fazer a pessoa
    mais feliz do mundo! 💍💕</p>
    <p>MEU HOMEM! ❤️</p>
    <div style="font-size:60px">💖💖💖</div>
  `;
}
</script>
